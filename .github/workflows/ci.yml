name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy app tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # 迁移依赖 pg_jieba 扩展（CREATE EXTENSION pg_jieba + to_tsvector('jiebacfg', ...)），
      # 原版 pgvector 镜像没有，需用仓库自建的 pgvector+pg_jieba 镜像。
      - name: Build pgvector+pg_jieba database image
        run: docker build -t kima-db:pg16-jieba ../docker/pgvector-jieba
      - name: Start database
        run: |
          docker run -d --name db \
            -e POSTGRES_USER=kima \
            -e POSTGRES_PASSWORD=kima \
            -e POSTGRES_DB=kima \
            -p 5432:5432 \
            kima-db:pg16-jieba
      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            if docker exec db pg_isready -U kima -d kima >/dev/null 2>&1; then
              echo "database ready"
              exit 0
            fi
            sleep 2
          done
          echo "database failed to become ready"
          docker logs db
          exit 1
      - run: uv run alembic upgrade head
