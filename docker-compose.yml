services:
  db:
    build:
      context: ./docker/pgvector-jieba
    image: kima-db:pg16-jieba
    container_name: kima-db
    environment:
      POSTGRES_USER: kima
      POSTGRES_PASSWORD: kima
      POSTGRES_DB: kima
    # 只绑 127.0.0.1（loopback）：开发时 host 上的 pytest/alembic 要连 localhost:5432，
    # 但不暴露给局域网/公网，满足生产收口诉求。
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kima -d kima"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: kima-backend:latest
    container_name: kima-backend
    environment:
      # 容器内通过服务名访问 db；asyncpg 方言由 SQLAlchemy 消费，checkpointer 用 psycopg 时会
      # 在 main.py 里把 +asyncpg 替换成 postgresql（见 _setup_copilot_checkpointer）。
      DATABASE_URL: postgresql+asyncpg://kima:kima@db:5432/kima
      # LLM / Embedding / Rerank / Search：默认 fake 可空跑；真实密钥从 shell/.env 传入
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-fake}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-https://api.siliconflow.cn/v1}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-fake}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-https://api.bochaai.com/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    # 只绑 127.0.0.1（loopback）：开发时 vite dev proxy 指向 localhost:8000，
    # 生产走 nginx 反代、不暴露给外部。
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: kima-frontend:latest
    container_name: kima-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
