services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kima-db
    environment:
      POSTGRES_USER: kima
      POSTGRES_PASSWORD: kima
      POSTGRES_DB: kima
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kima -d kima"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
