# kima 前端生产反代：托管静态产物 + 反代 /api、/health 到 backend 服务。
# 前端所有请求走相对路径（src/api/client.ts 里 BASE_URL=''），同源反代，无 CORS。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文档上传上限，对齐后端 MAX_FILE_SIZE = 50MB（nginx 先挡 413，与后端一致）
    client_max_body_size 50m;

    # 静态资源 + SPA fallback（BrowserRouter 深链刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代。SSE 流式（/api/chat、/api/copilot/chat、/api/copilot/approve）
    # 需关闭缓冲 + 拉长超时，否则事件被 nginx 攒着、前端读不到实时流。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查反代
    location /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
